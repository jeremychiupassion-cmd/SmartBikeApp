name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # 使用官方 Ubuntu 20.04 Docker 容器，避開工具鏈版本不相容問題
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y \
          python3 \
          python3-pip \
          python3-setuptools \
          build-essential \
          git \
          ffmpeg \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          ssl-cert \
          libssl-dev \
          libffi-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          autoconf \
          libtool \
          libtool-bin \
          m4 \
          gettext \
          pkg-config \
          cmake \
          curl

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip setuptools
        python3 -m pip install "cython<3.0.0" "buildozer==1.5.0"

    - name: Build APK with Buildozer
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUM: "true"
      run: |
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk