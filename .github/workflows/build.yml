name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-pip python3-setuptools \
          libffi-dev libssl-dev cython3 lld libltdl-dev autoconf automake libtool \
          zip unzip tar gzip bzip2 pkg-config zlib1g-dev \
          gfortran libopenblas-dev ninja-build cmake

    - name: Install Python dependencies
      # 鎖定 Cython 版本，避免與 NumPy 1.x 發生衝突
      run: |
        python -m pip install --upgrade pip
        pip install "Cython==0.29.33" buildozer

    - name: Build APK with Buildozer
      # 🛡️ 終極防護：在此宣告環境變數，強制降級 NumPy 到 1.25.2，避開所有 Ninja 衝突！
      run: |
        export VERSION_numpy=1.25.2
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk