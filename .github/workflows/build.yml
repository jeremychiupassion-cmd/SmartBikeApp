name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-pip python3-setuptools \
          libffi-dev libssl-dev lld libltdl-dev autoconf automake libtool \
          zip unzip tar gzip bzip2 pkg-config zlib1g-dev cmake ninja-build gfortran libopenblas-dev

    - name: Install Python Build Dependencies
      run: |
        python -m pip install --upgrade pip "setuptools<60.0.0" wheel
        pip install "Cython==0.29.33" buildozer

    - name: Build APK with Buildozer
      # 🛡️ 關鍵補回：強制降級 NumPy 版本，徹底封殺 Ninja 編譯錯誤
      run: |
        export VERSION_numpy=1.25.2
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk