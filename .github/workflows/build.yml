name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      # 安裝所有編譯 C++、OpenCV 與 NumPy 所需的系統底層函式庫
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-pip python3-setuptools \
          libffi-dev libssl-dev lld libltdl-dev autoconf automake libtool \
          zip unzip tar gzip bzip2 pkg-config zlib1g-dev cmake ninja-build gfortran libopenblas-dev

    - name: Install Python Build Dependencies
      # 確保 setuptools 是最新版 (提供 build_meta)，並將 Cython 鎖定在最穩定的 0.29.33
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "Cython==0.29.33" buildozer

    - name: Build APK with Buildozer
      # 透過環境變數鎖定 NumPy 版本為 v1.25.2，徹底避開 NumPy 2.0 的編譯崩潰
      run: |
        export VERSION_numpy=v1.25.2
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk