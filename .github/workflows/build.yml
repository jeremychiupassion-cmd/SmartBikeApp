name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix permissions for Buildozer Docker
      run: sudo chown -R 1000:1000 ${{ github.workspace }}

    - name: Build APK with Official Kivy Docker (Multi-Core)
      # 🚀 終極修復：同時傳入「4 核心加速」與「NumPy 版本鎖」，確保 Docker 內編譯順暢
      run: |
        docker run --rm \
        -e P4A_NUM_CORES=4 \
        -e VERSION_numpy=v1.25.2 \
        -v ${{ github.workspace }}:/home/user/hostcwd \
        kivy/buildozer:latest android debug

    - name: Restore permissions
      if: always()
      run: sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk