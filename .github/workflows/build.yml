name: Build SmartBike APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixin-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          zip \
          unzip \
          openjdk-17-jdk

        pip install --upgrade pip
        pip install buildozer "cython<3.0.0" virtualenv

    - name: Build APK with Buildozer
      run: |
        buildozer -s android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartBike-APK
        path: bin/*.apk