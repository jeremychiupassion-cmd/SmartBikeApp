name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix permissions for Buildozer Docker
      run: sudo chown -R 1000:1000 ${{ github.workspace }}

    - name: Build APK with Official Kivy Docker
      # 保持單核心 (P4A_NUM_CORES=1) 防 OOM，版本控制交給 buildozer.spec 處理
      run: |
        docker run --rm \
        -e P4A_NUM_CORES=1 \
        -v ${{ github.workspace }}:/home/user/hostcwd \
        kivy/buildozer:latest android debug

    - name: Restore permissions
      if: always()
      run: sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk