name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-pip python3-setuptools \
          libffi-dev libssl-dev lld libltdl-dev autoconf automake libtool \
          zip unzip tar gzip bzip2 pkg-config zlib1g-dev cmake ninja-build gfortran libopenblas-dev

    - name: Install Python Build Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "Cython<3.0.0" buildozer

    - name: Build APK with Buildozer
      # 🚀 終極防護與加速：
      # 1. 鎖定 NumPy v1.25.2 避開 Meson 構建錯誤
      # 2. 啟用 4 核心平行編譯，把 OpenCV 的編譯時間從 20 分鐘壓到 5 分鐘內
      run: |
        export VERSION_numpy=v1.25.2
        export P4A_NUM_CORES=4
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk